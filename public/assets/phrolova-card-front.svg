<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="50%" stop-color="#0d0a17"/>
      <stop offset="100%" stop-color="#150f24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c91440"/>
      <stop offset="100%" stop-color="#7b2d8e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Card background -->
  <rect width="600" height="900" rx="20" fill="url(#bg)"/>
  <rect x="2" y="2" width="596" height="896" rx="18" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>
  
  <!-- Placeholder text -->
  <text x="300" y="400" text-anchor="middle" fill="#b8b8c8" font-family="serif" font-size="28" opacity="0.5">PHROLOVA</text>
  <text x="300" y="440" text-anchor="middle" fill="#c91440" font-family="sans-serif" font-size="14" opacity="0.4">Replace with your card image</text>
  <text x="300" y="470" text-anchor="middle" fill="#7b2d8e" font-family="monospace" font-size="11" opacity="0.3">/public/assets/phrolova-card-front.png</text>
  
  <!-- Decorative lines -->
  <line x1="200" y1="500" x2="400" y2="500" stroke="#c91440" stroke-width="0.5" opacity="0.2"/>
  <circle cx="300" cy="300" r="80" fill="none" stroke="#7b2d8e" stroke-width="0.5" opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="300" cy="300" r="120" fill="none" stroke="#c91440" stroke-width="0.3" opacity="0.1" stroke-dasharray="2 8"/>
</svg>
